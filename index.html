<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colores</title>

    <!-- CSS -->    
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/components/button.css">
    <link rel="stylesheet" href="css/components/containers.css">
    <link rel="stylesheet" href="css/components/create-color.css">
    <link rel="stylesheet" href="css/components/header.css">
    <link rel="stylesheet" href="css/components/footer.css">
    <link rel="stylesheet" href="css/components/color-picker.css">

    <!-- CSS: Introduccion -->
    <link rel="stylesheet" href="css/components/colors.css">
    <link rel="stylesheet" href="css/components/cursor.css">
    
    <!-- JAVASCRIPT -->
    <script src="js/colors.js" defer></script>
    <script src="js/script.js" defer></script>

    <!-- JAVASCRIPT: Introduccion -->
    <script src="js/create-color.js" defer></script>
    <script src="js/cursor.js" defer></script>

</head>


  <body>


    <header id="header" class="logo oculto">
      <h1>Color Picker</h1>
    </header>
    

        <!-- INTRO HTML CODE -->

        <button id="expand" class="expand"></button>

        <div id="green" class="circle"></div>

        <div id="red" class="red"></div>

        <div id="blue" class="blue"></div>

    
    <main id="main" class="oculto">


      <div class="color"></div>


        <div class="main-horizontal-container">
            <div class="vertical-container">
                <div class="horizontal-container">

                    <input type="range" id="r" min="0" max="255" value="255"/>
                    <input type="number" id="rValue" min="0" max="255" value="255"/>

                </div class="horizontal-container">
                <div class="horizontal-container">

                    <input type="range" id="g" min="0" max="255" value="255"/>
                    <input type="number" id="gValue" min="0" max="255" value="255"/>

                </div>
                <div class="horizontal-container">

                    <input type="range" id="b" min="0" max="255" value="255"/>
                    <input type="number" id="bValue" min="0" max="255" value="255"/>

                </div>

            </div>
            
            <div class="vertical-container">
                <div class="vertical-container">
                    <div>
                        <div id="create-color"></div>
                    </div>
                    <div class="horizontal-container">
                        <button id="btnRGB" title="Aceptar" class="accept-button">
                          <img src="assets/img/accept.png" alt="Aceptar" style="width: 40px; height: 40px;">
                        </button>
                        <button id="btnCopyColor" title="Copiar al portapapeles">
                          <img src="assets/img/copy.png" alt="Copiar" style="width: 30px; height: 30px;">
                        </button>
                    </div>

                </div>
            </div>

        </div>

      <ul id="lista"></ul>

      <script src="./js/script.js"></script>
 
      <ul id="lista"></ul>

    </main>
    <footer>
      <p>2J3M - P3: Primer parcial - 2026</p>
    </footer>
  </body>
</html>
